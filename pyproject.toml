[project]
name = "tidyline"
version = "0.2.2"
description = "Offline, read-only audit of a Things 3 database on macOS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Laxman Rathod" }]
keywords = ["things", "things3", "gtd", "audit", "cli", "macos", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "things-py>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/rathodlaxman/tidyline"
Source = "https://github.com/rathodlaxman/tidyline"
Issues = "https://github.com/rathodlaxman/tidyline/issues"

[project.scripts]
tidyline = "tidyline.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
